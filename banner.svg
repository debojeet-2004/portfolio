<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Core Space Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Neon Shiny Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    
    <!-- Premium Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background with subtle metallic border -->
  <rect width="100%" height="240" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Aesthetic Tech Grid -->
  <path d="M 0,30 H 800 M 0,60 H 800 M 0,90 H 800 M 0,120 H 800 M 0,150 H 800 M 0,180 H 800 M 0,210 H 800" stroke="#475569" stroke-opacity="0.08" stroke-width="1"/>
  <path d="M 80,0 V 240 M 160,0 V 240 M 240,0 V 240 M 320,0 V 240 M 400,0 V 240 M 480,0 V 240 M 560,0 V 240 M 640,0 V 240 M 720,0 V 240" stroke="#475569" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Neon Backlights (Ambient Glows) -->
  <circle cx="720" cy="60" r="130" fill="#a855f7" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="100" cy="180" r="90" fill="#0ea5e9" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="450" cy="120" r="70" fill="#f43f5e" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Geometric Shiny Spheres & Mesh Elements -->
  <circle cx="660" cy="120" r="75" stroke="url(#accentCyan)" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>
  <circle cx="660" cy="120" r="60" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="660" cy="120" r="45" stroke="url(#accentCyan)" stroke-width="2" opacity="0.6"/>
  <!-- Glowing core sphere -->
  <circle cx="660" cy="120" r="20" fill="url(#accentCyan)" opacity="0.8" filter="url(#glow)"/>
  <circle cx="660" cy="120" r="10" fill="#ffffff"/>

  <!-- Decorative Orbit Dots -->
  <circle cx="660" cy="45" r="3" fill="#38bdf8"/>
  <circle cx="585" cy="120" r="3" fill="#f43f5e"/>
  <circle cx="705" cy="165" r="4" fill="#a855f7"/>

  <!-- Premium Shiny Sparkles (4-pointed vector stars) -->
  <!-- Sparkle 1 (Near Title) -->
  <path d="M 280,60 Q 280,70 290,70 Q 280,70 280,80 Q 280,70 270,70 Q 280,70 280,60 Z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M 280,60 Q 280,70 290,70 Q 280,70 280,80 Q 280,70 270,70 Q 280,70 280,60 Z" fill="#ffffff"/>
  
  <!-- Sparkle 2 (Near Right Spheres) -->
  <path d="M 540,140 Q 540,146 546,146 Q 540,146 540,152 Q 540,146 534,146 Q 540,146 540,140 Z" fill="#38bdf8" filter="url(#glow)"/>
  <path d="M 540,140 Q 540,146 546,146 Q 540,146 540,152 Q 540,146 534,146 Q 540,146 540,140 Z" fill="#ffffff"/>

  <!-- Sparkle 3 (Top Left corner) -->
  <path d="M 80,40 Q 80,48 88,48 Q 80,48 80,56 Q 80,48 72,48 Q 80,48 80,40 Z" fill="#a855f7" opacity="0.8"/>

  <!-- Sparkle 4 (Bottom Right) -->
  <path d="M 720,180 Q 720,186 726,186 Q 720,186 720,192 Q 720,186 714,186 Q 720,186 720,180 Z" fill="#f43f5e" opacity="0.8"/>

  <!-- Left-Aligned Header Typography -->
  <!-- Tiny Category Pre-title -->
  <text x="60" y="70" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="4" opacity="0.95">PORTFOLIO &amp; WORKSPACE</text>
  
  <!-- Developer Full Name -->
  <text x="56" y="122" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Debojeet Karmakar</text>
  
  <!-- ATS & Human Reader Alignment Subtitle -->
  <text x="60" y="162" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1">Full-Stack Engineer  |  Creative Developer  |  SaaS Builder</text>

  <!-- Glowing Accent Underline -->
  <rect x="60" y="182" width="120" height="4.5" rx="2.25" fill="url(#accentCyan)" filter="url(#glow)"/>
  <rect x="60" y="182" width="120" height="4.5" rx="2.25" fill="url(#accentCyan)"/>

  <!-- Diagonal Shiny Glassmorphic Overlay Sweeping the Banner -->
  <path d="M -50,0 L 250,0 L 50,240 L -250,240 Z" fill="url(#shineGrad)"/>
</svg>
